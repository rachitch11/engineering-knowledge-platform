services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EPHEMERAL_SESSIONS_ENABLED: "true"
      SINGLE_USER_MODE: "false"
      SESSION_STORE_ROOT: /data/ephemeral_sessions
      SESSION_TTL_SECONDS: "3600"
      SESSION_CLEANUP_INTERVAL_SECONDS: "300"
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      CHROMA_PATH: /data/legacy_chroma
      BM25_INDEX_PATH: /data/legacy_bm25.json
    volumes:
      - ekip-sessions:/data/ephemeral_sessions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ui:
    build: .
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  ekip-sessions:
